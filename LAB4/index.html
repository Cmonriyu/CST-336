<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Sign Up Form </h1>

    <fieldset>
        <legend>Sign Up</legend>
        First Name: <input type="text"><br>
        Last Name: <input type="text"><br>
        Email: <input type="text"><br>
        Phone Number:<input type="text"><br><br>
        Zip Code: <input type="text" id="zip"><br>
        City: <text id="city"></text>
        <br>
        Latitude: <text id="lat"></text>
        <br>
        Longitude: <text id="long"></text>
        <br><br>
        State: <select></select><br>
        Select a County: <select></select><br>

        Desired Username: <input type="text" id="username"><br>
        Password: <input type="password" id="password"> <text id="suggested">Suggested Password: </text><br>
        Type Password Again: <input type="password" id="passwordConfirm"><br>
        <input type="submit" value="Sign up!" id="submit">
        <p id="error"></p>
        <p id="passworderror"></p>
    </fieldset>

    <script src="js/script.js"></script>


</body>

</html>
