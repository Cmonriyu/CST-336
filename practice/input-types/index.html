<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="basic-input">Animal noise</label>
    <input id="basic-input" type="text">

    <br/>

    <label for="age-input">Age</label>
    <input id="age" max="10" type="number">

    <br/>

    <label for="car-model-input">Car Model</label>
    <select id="car-model-input">
        <option id="Civic" value="Civic"><label for="Civic">Honda Civic</label></option>
        <option id="Miata" value="Miata"><label for="Miata">Mazda Mx5 Miata</label></option>
        <option id="Cappucino" value="Cappucino"><label for="Cappucino">Suzuki Cappucino</label></option>
    </select> 
    <label for="statesInput">States</label>
    <select id="states">
        <option id="California" value="CA">Orange</option>
        <option id="Arkansas" value="AR">Arkansas</option>
    </select>

    <br />
    <label>Topping</label>
    <input type="checkbox" name="toppings" id="lettuce"><label for="lettuce">Lettuce</label>
    <input type="checkbox" name="toppings" id="tomato"><label for="tomato">Tomato</label>
    <input type="checkbox" name="toppings" id="anchovy"><label for="anchovy">Anchovy</label>

    <br/>
    <label>True or False</label>
    <input type="radio" id = "true" value = "T" name="TorF"><label for="true">True</label>
    <input type="radio" id = "false" value = "F" name="TorF"><label for="false">False</label>

    <script src="scripts/scripts.js" defer></script>
    <script src="scripts/array.js" defer></script>

</body>

</html>
